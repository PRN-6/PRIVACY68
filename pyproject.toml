[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy68"
version = "1.5.0"
description = "A Windows voice assistant for desktop automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SpeechRecognition>=3.10.0",
    "numpy>=1.26,<3",
    "sounddevice>=0.4.6,<1",
    "litellm>=1.50,<2",
    "ollama>=0.4,<1",
    "requests>=2.31.0",
    "customtkinter>=5.2.0",
    "darkdetect>=0.8.0",
    "Pillow>=10,<13",
    "pystray>=0.19,<1",
    "pyttsx3>=2.90,<3",
    "pywebview>=5,<7",
    "pyautogui>=0.9.54,<1",
    "pywinauto>=0.6.8,<1",
    "pywin32>=306",
    "python-dotenv>=1.0.0",
    "pyinstaller>=6,<7",
]

[project.scripts]
privacy68 = "app:main"

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["actions*", "computer_use*", "plugins*", "server*", "speech*", "ui*", "utils*"]
exclude = ["tests*", "website*"]
