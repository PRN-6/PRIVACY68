[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy68"
version = "1.7.4"
description = "A Windows text assistant for desktop automation"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50,<2",
    "ollama>=0.4,<1",
    "requests>=2.31.0",
    "Pillow>=10,<13",
    "pystray>=0.19,<1",
    "pywebview>=5,<7",
    "pyautogui>=0.9.54,<1",
    "pywinauto>=0.6.8,<1",
    "pywin32>=306",
    "python-dotenv>=1.0.0",
    "pyinstaller>=6,<7",
]

[project.scripts]
privacy68 = "app:main"

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["actions*", "channels*", "computer_use*", "services*", "skills*", "ui*", "utils*"]
exclude = ["tests*", "website*"]

[tool.setuptools.package-data]
ui = ["dashboard/*.html"]
skills = ["*/SKILL.md"]
