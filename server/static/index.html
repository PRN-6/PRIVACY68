<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PRIVACY68 Mobile Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <div class="logo-orb">
                    <div class="orb-core"></div>
                    <div class="orb-ring"></div>
                </div>
                <div class="brand-text">
                    <div class="brand-title">PRIVACY68 <span class="badge">REMOTE</span></div>
                    <div class="brand-sub" id="pc-target">Connecting to PC...</div>
                </div>
            </div>
            <div class="header-actions">
                <div class="status-chip" id="connection-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Online</span>
                </div>
                <button class="icon-btn" id="btn-qr" title="Show Pairing QR Code">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM15 15h2v2h-2zM19 15h2v2h-2zM15 19h2v2h-2zM19 19h2v2h-2z"/></svg>
                </button>
            </div>
        </header>

        <!-- Command Input Section -->
        <main class="main-content">
            <section class="command-card">
                <div class="card-label">COMMAND DISPATCH</div>
                <form id="command-form" class="input-form">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="command-input" 
                            placeholder="Type 'Open Chrome', 'volume up'..." 
                            autocomplete="off"
                            autocorrect="off"
                            spellcheck="false"
                            required
                        >
                        <button type="button" class="mic-btn" id="btn-mic" title="Speak into Phone Mic">
                            <svg class="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="22"></line>
                                <line x1="8" y1="22" x2="16" y2="22"></line>
                            </svg>
                            <span class="mic-pulse"></span>
                        </button>
                    </div>
                    <button type="submit" class="send-btn" id="btn-send">
                        <span>Send to PC</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </form>
                <div class="voice-status" id="voice-status" style="display: none;">
                    <span class="pulse-dot"></span>
                    <span id="voice-status-text">Listening... Speak now</span>
                </div>
            </section>

            <!-- Quick Action Grid -->
            <section class="section">
                <div class="section-title">
                    <span>⚡ Quick Actions</span>
                    <span class="section-sub">Tap to execute on PC</span>
                </div>
                
                <!-- Category Tabs -->
                <div class="category-tabs">
                    <button class="tab-btn active" data-cat="all">All</button>
                    <button class="tab-btn" data-cat="Apps">Apps</button>
                    <button class="tab-btn" data-cat="Media">Media</button>
                    <button class="tab-btn" data-cat="System">System</button>
                </div>

                <div class="actions-grid" id="actions-grid">
                    <!-- Loaded dynamically via JS -->
                </div>
            </section>

            <!-- Live Execution Feed -->
            <section class="section">
                <div class="section-title">
                    <span>📜 Recent Commands</span>
                    <button class="clear-btn" id="btn-clear-history">Clear</button>
                </div>
                <div class="history-list" id="history-list">
                    <div class="empty-history">No commands dispatched yet. Speak or type above!</div>
                </div>
            </section>
        </main>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>

        <!-- QR Code Pairing Modal -->
        <div class="modal" id="qr-modal">
            <div class="modal-backdrop" id="modal-backdrop"></div>
            <div class="modal-card">
                <div class="modal-header">
                    <div class="modal-title">📱 Connect Other Devices</div>
                    <button class="close-btn" id="btn-close-modal">&times;</button>
                </div>
                <div class="modal-body">
                    <p class="modal-desc">Scan this QR code with any phone or tablet on the same Wi-Fi network:</p>
                    <div class="qr-box">
                        <img id="qr-image" src="/api/qr" alt="Pairing QR Code">
                    </div>
                    <div class="url-badge" id="modal-url">http://...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
