name: Build & Release PRIVACY68

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows installer and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt .

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Build application bundle
        run: python build_exe.py

      - name: Extract and validate release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Release tag ${{ github.ref_name }} does not match project version v$version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "/DAppVersion=${{ steps.version.outputs.VERSION }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Package application bundle
        shell: pwsh
        run: |
          $version = "v${{ steps.version.outputs.VERSION }}"
          $zipName = "PRIVACY68-$version-Windows-x64.zip"
          Compress-Archive -Path dist\PRIVACY68\* -DestinationPath $zipName
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          name: "PRIVACY68 ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}"
          body: |
            ## What's Changed in ${{ steps.version.outputs.VERSION }}
            - Text commands through the dashboard, tray command bar, and paired Telegram chat.
            - Removed recording, transcription, voice settings, and speech dependencies.
            - Preserved typed message content and corrected browser failure reporting.
            - Simplified UI threading and application shutdown.
            - Corrected package discovery and bundled dashboard and skill resources.

            ## Requirements
            Windows 10/11 and WebView2 for the dashboard. Configure a cloud AI provider or a separate local model server for complex commands.
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_NAME }}
            installer/PRIVACY68-Setup-*.exe
