name: Build & Release PRIVACY68

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows installer and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt .

      - name: Check bundled speaker model
        run: |
          if (-not (Test-Path "assets/models/speaker_model.onnx")) {
            Write-Error "Missing assets/models/speaker_model.onnx — the installer requires it."
            exit 1
          }

      - name: Run unit tests
        run: python -m unittest discover tests -v

      - name: Build application bundle
        run: python build_exe.py

      - name: Extract and validate release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Release tag ${{ github.ref_name }} does not match project version v$version."
          }
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "/DAppVersion=${{ steps.version.outputs.VERSION }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Package application bundle
        shell: pwsh
        run: |
          $version = "v${{ steps.version.outputs.VERSION }}"
          $zipName = "PRIVACY68-$version-Windows-x64.zip"
          Compress-Archive -Path dist\PRIVACY68\* -DestinationPath $zipName
          "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PRIVACY68 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_NAME }}
            installer/PRIVACY68-Setup-*.exe
