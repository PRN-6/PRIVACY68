name: Build & Release PRIVACY68

# ─── Trigger ──────────────────────────────────────────────────────────────────
# Fires when you push a version tag, e.g.: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:      # allow manual trigger from Actions tab

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write         # needed to create/upload GitHub Release assets

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:
  build-and-release:
    name: Build EXE & Create GitHub Release
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Verify website plugin downloads are in sync ───────────────────────
      - name: Check website plugin sync
        run: python sync_website_plugins.py --check

      # ── 5. Verify the bundled speaker model is present ───────────────────────
      - name: Check bundled speaker model
        run: |
          if (-not (Test-Path "assets/models/speaker_model.onnx")) {
            Write-Error "Missing assets/models/speaker_model.onnx — the voice-auth tests need it."
            exit 1
          }
          Write-Host "Bundled speaker model present."

      # ── 6. Run the test suite ────────────────────────────────────────────────
      - name: Run unit tests
        run: python -m unittest discover tests -v

      # ── 7. Build EXE with PyInstaller ─────────────────────────────────────────
      - name: Build EXE (PyInstaller)
        run: python build_exe.py

      # ── 8. Determine version from tag ─────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # ── 9. Build Inno Setup Installer ─────────────────────────────────────────
      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # ── 10. Zip the dist folder ────────────────────────────────────────────────
      - name: Zip dist output
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $zipName = "PRIVACY68-$version-Windows-x64.zip"
          Compress-Archive -Path dist\PRIVACY68\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      # ── 11. Create GitHub Release and upload assets ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "PRIVACY68 ${{ steps.version.outputs.VERSION }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            ${{ env.ZIP_NAME }}
            installer/PRIVACY68-Setup-*.exe
