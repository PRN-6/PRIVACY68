name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Quality Checks
    runs-on: windows-latest

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Verify website plugin downloads match canonical sources ─────────────
      - name: Check website plugin sync
        run: python sync_website_plugins.py --check

      # ── 5. Run the test suite ──────────────────────────────────────────────────
      - name: Run unit tests
        run: python -m unittest discover tests -v

      # ── 6. Byte-compile every source file (catches syntax errors) ──────────────
      - name: Byte-compile sources
        run: |
          python -m compileall -q actions plugins computer_use speech ui utils server tests app.py config.py
