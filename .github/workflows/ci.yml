name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Quality Checks
    runs-on: windows-latest

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Verify website plugin downloads match canonical sources ─────────────
      - name: Check website plugin sync
        run: python sync_website_plugins.py --check

      # ── 5. Verify the bundled speaker model is present ─────────────────────────
      # The voice-auth tests need the CAM++ ONNX model. It is committed to the
      # repository so the suite runs offline; this step fails fast with a clear
      # message instead of a confusing IndexError further down.
      - name: Check bundled speaker model
        run: |
          if (-not (Test-Path "assets/models/speaker_model.onnx")) {
            Write-Error "Missing assets/models/speaker_model.onnx — the voice-auth tests need it."
            exit 1
          }
          Write-Host "Bundled speaker model present."

      # ── 6. Run the test suite ──────────────────────────────────────────────────
      - name: Run unit tests
        shell: pwsh
        run: |
          $output = python -m unittest discover tests -v 2>&1
          $code = $LASTEXITCODE
          $output | Tee-Object -FilePath ci-test-output.log
          Write-Output $output
          if ($code -ne 0) {
            # Surface each failing test as a workflow annotation so the
            # failure is visible in the PR/commit view without downloading
            # the log artifact.
            $output | ForEach-Object { $_.ToString() } |
              Select-String -Pattern '^(FAIL|ERROR):\s+(\S+)' -AllMatches |
              ForEach-Object {
                $name = $_.Matches[0].Groups[2].Value
                Write-Output "::error file=tests/,title=Test failure::$name"
              }
          }
          exit $code

      # ── 7. Byte-compile every source file (catches syntax errors) ──────────────
      - name: Byte-compile sources
        run: |
          python -m compileall -q actions core plugins extra_plugins computer_use speech ui utils server tests app.py config.py

      # ── 8. Upload the test log when the suite fails ────────────────────────────
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-log
          path: ci-test-output.log
          if-no-files-found: ignore
